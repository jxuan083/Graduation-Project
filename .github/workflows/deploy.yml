name: CI and Manual Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: What should be deployed after verification?
        required: true
        default: verify-only
        type: choice
        options:
          - verify-only
          - frontend
          - all

# PR 只跑 CI；push 到 main 通過 CI 後自動部署後端＋前端（CD）；
# 手動觸發可選 verify-only / frontend / all。
# 只有 PR 會取消舊的 run，main 上的部署排隊執行，避免部署被中途砍掉。
# 依事件分組：手動部署不會把同一分支 push 觸發的 CI 取消掉（2026-10 發生過，顯示成紅叉）。
concurrency:
  group: ci-deploy-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  # 角色 ARN、App ID 不是機密；GitHub OIDC 只允許這個 repo assume 這個角色
  AWS_DEPLOY_ROLE: arn:aws:iam::746364933094:role/phubbing-github-deploy
  AMPLIFY_APP_ID: dm3mlaqpivp0d
  EC2_NAME_TAG: phubbing-backend

jobs:
  # ── CI gate: push、PR、手動部署都必須先通過 ──
  verify:
    timeout-minutes: 20
    env:
      DOCSTORE: memory
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements-core.txt
            backend/requirements-test.txt

      - name: Install test dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements-test.txt
          npx playwright install --with-deps chromium

      - name: Run frontend unit tests
        run: npm test

      - name: Check JavaScript syntax
        run: find frontend tests e2e -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check Python syntax
        run: python -m py_compile backend/*.py

      - name: Run backend unit tests
        run: python scripts/test_backend.py

      - name: Browser navigation and pet inventory
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7

  # ── Frontend: Amplify Hosting ──
  deploy-frontend:
    timeout-minutes: 12
    needs: [verify, deploy-backend]
    if: >-
      always() && !cancelled() && needs.verify.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.deploy-backend.result == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.deploy_target == 'frontend' ||
      (inputs.deploy_target == 'all' && needs.deploy-backend.result == 'success'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply Cache-Control headers
        run: aws amplify update-app --app-id "$AMPLIFY_APP_ID" --custom-headers "$(cat deploy/amplify-headers.yml)" > /dev/null

      - name: Upload frontend to Amplify
        run: |
          (cd frontend && zip -qr ../site.zip .)
          read -r JOB URL < <(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main \
            --query '[jobId,zipUploadUrl]' --output text)
          curl -fsS -X PUT -H "Content-Type: application/zip" --data-binary @site.zip "$URL"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$JOB" > /dev/null
          for i in $(seq 1 60); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$JOB" \
              --query job.summary.status --output text)
            echo "Amplify job $JOB: $STATUS"
            [ "$STATUS" = SUCCEED ] && exit 0
            [ "$STATUS" = FAILED ] || [ "$STATUS" = CANCELLED ] && exit 1
            sleep 5
          done
          exit 1

  # ── Backend: EC2（單一主機）──
  # 只能有一台：WebSocket 房間狀態是 process-local，所以是在固定那台 EC2 上
  # git pull + docker compose 重建，不做多台 / auto scaling。
  deploy-backend:
    timeout-minutes: 40
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'all'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on EC2 via SSM
        run: |
          INSTANCE=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$EC2_NAME_TAG" Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ -n "$INSTANCE" ] && [ "$INSTANCE" != None ] || { echo "Backend instance not found"; exit 1; }
          python3 - <<'PYTHON'
          import json, os, re
          sha = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid revision')
          command = f'cd /opt/phubbing/app && git fetch origin main && git checkout --detach {sha} && bash deploy/deploy.sh main {sha}'
          with open('/tmp/ssm-deploy.json','w') as handle:
              json.dump({'commands':[command],'executionTimeout':['1800']},handle)
          PYTHON
          CMD=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" --parameters file:///tmp/ssm-deploy.json \
            --query Command.CommandId --output text)
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "SSM $CMD: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
                  --query StandardOutputContent --output text | tail -50
                exit 1 ;;
            esac
            sleep 15
          done
          [ "$STATUS" = Success ] || exit 1

      - name: Health check
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://35-73-255-236.sslip.io/api/health > /tmp/health.json
          python3 - <<'PYTHON'
          import json, os
          with open('/tmp/health.json') as handle:
              health = json.load(handle)
          assert health['status'] == 'ok', health
          assert health['commit'] == os.environ['GITHUB_SHA'], 'Backend revision differs from verified commit'
          PYTHON
