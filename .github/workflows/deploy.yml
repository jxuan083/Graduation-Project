name: CI and Manual Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: What should be deployed after verification?
        required: true
        default: verify-only
        type: choice
        options:
          - verify-only
          - frontend
          - all

# push / PR 自動跑 CI；部署只允許從 GitHub Actions 手動觸發。
# 依事件分組：手動部署不會把同一分支 push 觸發的 CI 取消掉（2026-10 發生過，顯示成紅叉）。
concurrency:
  group: ci-deploy-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-1
  # 角色 ARN、App ID 不是機密；GitHub OIDC 只允許這個 repo assume 這個角色
  AWS_DEPLOY_ROLE: arn:aws:iam::746364933094:role/phubbing-github-deploy
  AMPLIFY_APP_ID: dm3mlaqpivp0d
  EC2_NAME_TAG: phubbing-backend

jobs:
  # ── CI gate: push、PR、手動部署都必須先通過 ──
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run frontend unit tests
        run: npm test

      - name: Check JavaScript syntax
        run: find frontend tests -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check Python syntax
        run: python -m py_compile backend/*.py

      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -v

  # ── Frontend: Amplify Hosting ──
  deploy-frontend:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.deploy_target == 'frontend' || inputs.deploy_target == 'all')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply Cache-Control headers
        run: aws amplify update-app --app-id "$AMPLIFY_APP_ID" --custom-headers "$(cat deploy/amplify-headers.yml)" > /dev/null

      - name: Upload frontend to Amplify
        run: |
          (cd frontend && zip -qr ../site.zip .)
          read -r JOB URL < <(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main \
            --query '[jobId,zipUploadUrl]' --output text)
          curl -fsS -X PUT -H "Content-Type: application/zip" --data-binary @site.zip "$URL"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$JOB" > /dev/null
          for i in $(seq 1 60); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$JOB" \
              --query job.summary.status --output text)
            echo "Amplify job $JOB: $STATUS"
            [ "$STATUS" = SUCCEED ] && exit 0
            [ "$STATUS" = FAILED ] || [ "$STATUS" = CANCELLED ] && exit 1
            sleep 5
          done
          exit 1

  # ── Backend: EC2（單一主機）──
  # 只能有一台：WebSocket 房間狀態是 process-local，所以是在固定那台 EC2 上
  # git pull + docker compose 重建，不做多台 / auto scaling。
  deploy-backend:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_target == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on EC2 via SSM
        run: |
          INSTANCE=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$EC2_NAME_TAG" Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"cd /opt/phubbing/app && git fetch origin ${GITHUB_REF_NAME} && git checkout -f -B ${GITHUB_REF_NAME} origin/${GITHUB_REF_NAME} && bash deploy/deploy.sh ${GITHUB_REF_NAME}\"],executionTimeout=[\"1800\"]" \
            --query Command.CommandId --output text)
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "SSM $CMD: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
                  --query StandardOutputContent --output text | tail -50
                exit 1 ;;
            esac
            sleep 15
          done
          [ "$STATUS" = Success ] || exit 1

      - name: Health check
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://35-73-255-236.sslip.io/api/health
