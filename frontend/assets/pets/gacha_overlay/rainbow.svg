  <path d="M28,340 Q28,90 200,67 Q372,90 372,340" fill="none" stroke="#F97316" stroke-width="11" opacity="0.85"/>
  <path d="M38,340 Q38,100 200,79 Q362,100 362,340" fill="none" stroke="#EAB308" stroke-width="11" opacity="0.85"/>
  <path d="M48,340 Q48,110 200,91 Q352,110 352,340" fill="none" stroke="#22C55E" stroke-width="11" opacity="0.85"/>
  <path d="M58,340 Q58,120 200,103 Q342,120 342,340" fill="none" stroke="#3B82F6" stroke-width="11" opacity="0.85"/>
  <path d="M68,340 Q68,130 200,115 Q332,130 332,340" fill="none" stroke="#6366F1" stroke-width="11" opacity="0.85"/>
  <path d="M78,340 Q78,140 200,127 Q322,140 322,340" fill="none" stroke="#A855F7" stroke-width="11" opacity="0.85"/>
  <!-- Soft white cloud puff at base of rainbow (left) -->
  <ellipse cx="28"  cy="340" rx="22" ry="14" fill="white" opacity="0.7"/>
  <ellipse cx="50"  cy="333" rx="18" ry="13" fill="white" opacity="0.7"/>
  <!-- Soft white cloud puff at base of rainbow (right) -->
  <ellipse cx="372" cy="340" rx="22" ry="14" fill="white" opacity="0.7"/>
  <ellipse cx="350" cy="333" rx="18" ry="13" fill="white" opacity="0.7"/>
  <!-- Small sparkles on rainbow -->
  <circle cx="200" cy="52"  r="4" fill="white" opacity="0.7"/>
  <circle cx="156" cy="60"  r="3" fill="white" opacity="0.6"/>
  <circle cx="244" cy="60"  r="3" fill="white" opacity="0.6"/>
</svg>
