<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Rainbow arc behind the puppy, center ~(200,320), arcs go up over head -->
  <!-- Rainbow bands (red outermost → violet innermost), all arcs centered at bottom -->
