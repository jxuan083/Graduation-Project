    <line x1="16" y1="16" x2="25" y2="25"   stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <line x1="0"  y1="22" x2="0"  y2="36"   stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
    <line x1="-16" y1="16" x2="-25" y2="25" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="0"  x2="-36" y2="0"  stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
