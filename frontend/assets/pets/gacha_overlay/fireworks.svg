    <line x1="22" y1="-22" x2="36" y2="-36" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="0"  x2="52" y2="0"    stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="36" y2="36"   stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0"  y1="32" x2="0"  y2="52"   stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-22" y1="22" x2="-36" y2="36" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
