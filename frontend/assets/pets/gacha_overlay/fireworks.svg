    <line x1="20" y1="-20" x2="31" y2="-31" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="0"  x2="44" y2="0"    stroke="#F472B6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="31" y2="31"   stroke="#F472B6" stroke-width="2.5" stroke-linecap="round"/>
