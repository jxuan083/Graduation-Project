  <circle cx="196" cy="17" r="4"   fill="#93C5FD" opacity="0.75"/>
  <!-- Right gem -->
  <circle cx="257" cy="31" r="10" fill="#10B981" stroke="#047857" stroke-width="2"/>
  <circle cx="254" cy="28" r="3.5" fill="#6EE7B7" opacity="0.75"/>
