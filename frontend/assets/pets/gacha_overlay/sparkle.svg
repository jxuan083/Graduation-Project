  <path d="M94,88 L97,99 L108,99 L100,106 L103,117 L94,110 L85,117 L88,106 L80,99 L91,99Z"
        fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Top-right sparkle -->
  <path d="M310,72 L312,80 L320,80 L314,85 L316,93 L310,88 L304,93 L306,85 L300,80 L308,80Z"
        fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
