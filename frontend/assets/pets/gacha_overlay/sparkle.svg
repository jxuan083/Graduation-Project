  <!-- Bottom-right sparkle -->
  <path d="M318,310 L320,316 L326,316 L322,320 L323,326 L318,322 L313,326 L314,320 L310,316 L316,316Z"
        fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Extra tiny twinkle dots -->
  <circle cx="135" cy="58" r="3.5" fill="#FDE68A"/>
  <circle cx="265" cy="98" r="3"   fill="#FBBF24"/>
  <circle cx="52"  cy="240" r="3"  fill="#FEF3C7" opacity="0.9"/>
  <circle cx="348" cy="250" r="3"  fill="#FEF3C7" opacity="0.9"/>
  <line x1="94"  y1="84" x2="94"  y2="92" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <line x1="90"  y1="88" x2="98"  y2="88" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <line x1="310" y1="68" x2="310" y2="76" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
  <line x1="306" y1="72" x2="314" y2="72" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
