<svg xmlns="http://www.w3.org/2000/svg" viewBox="120.8 180.8 158.5 158.5">
  <!-- Tuxedo: formal suit body covers y=200-330 -->
  <!-- Jacket shadow -->
  <path d="M136,205 L132,328 L268,328 L264,205 Q244,196 222,200 L200,210 L178,200 Q156,196 136,205Z"
        fill="#111827" opacity="0.18" transform="translate(4,4)"/>
  <!-- Jacket body -->
  <path d="M136,205 L132,325 L268,325 L264,205 Q244,195 222,199 L200,210 L178,199 Q156,195 136,205Z"
        fill="#1F2937" stroke="#111827" stroke-width="2.5"/>
  <!-- White shirt front -->
  <path d="M178,200 L200,210 L222,200 L218,325 L182,325Z" fill="#F9FAFB"/>
  <!-- Shirt pleats/ruffle -->
  <line x1="193" y1="225" x2="193" y2="316" stroke="#E5E7EB" stroke-width="1.5"/>
  <line x1="200" y1="222" x2="200" y2="316" stroke="#E5E7EB" stroke-width="1.5"/>
  <line x1="207" y1="225" x2="207" y2="316" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- Left lapel -->
  <path d="M136,205 Q156,195 178,199 L200,210 L180,235 Q152,240 136,225Z"
        fill="#374151" stroke="#1F2937" stroke-width="2"/>
  <path d="M142,208 Q158,198 176,201 L196,210 L178,232 Q154,237 142,223Z"
        fill="#4B5563" opacity="0.6"/>
  <!-- Right lapel -->
  <path d="M264,205 Q244,195 222,199 L200,210 L220,235 Q248,240 264,225Z"
        fill="#374151" stroke="#1F2937" stroke-width="2"/>
  <path d="M258,208 Q242,198 224,201 L204,210 L222,232 L258,223Z"
        fill="#4B5563" opacity="0.6"/>
  <!-- Bow tie at neck -->
  <path d="M182,200 Q191,206 200,210 Q191,214 182,210 Q186,205 182,200Z" fill="#1F2937"/>
  <path d="M218,200 Q209,206 200,210 Q209,214 218,210 Q214,205 218,200Z" fill="#1F2937"/>
  <ellipse cx="200" cy="210" rx="6" ry="5" fill="#374151" stroke="#111827" stroke-width="1.5"/>
  <!-- Shirt buttons -->
  <circle cx="200" cy="232" r="4"   fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1.5"/>
  <circle cx="200" cy="252" r="4"   fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1.5"/>
  <circle cx="200" cy="272" r="4"   fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1.5"/>
  <!-- Pocket square (left breast) -->
  <path d="M148,232 L148,248 L168,248 L168,236 Q158,232 148,232Z" fill="none" stroke="#374151" stroke-width="1.5"/>
  <path d="M150,232 Q158,228 164,235" stroke="#F9FAFB" stroke-width="2" fill="none" opacity="0.7"/>
</svg>
