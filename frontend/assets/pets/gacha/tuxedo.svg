<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#F9FAFB"/>

  <!-- Drop shadow -->
  <ellipse cx="100" cy="170" rx="58" ry="9" fill="#111827" opacity="0.2"/>

  <!-- Jacket main body -->
  <path d="M38,70 L38,162 Q38,168 44,168 L156,168 Q162,168 162,162 L162,70 Q162,56 148,52 L126,46 Q118,56 100,62 Q82,56 74,46 L52,52 Q38,56 38,70 Z"
        fill="#1F2937" stroke="#111827" stroke-width="2"/>

  <!-- White shirt front panel -->
  <path d="M86,56 Q90,78 100,86 Q110,78 114,56 L112,46 Q106,54 100,58 Q94,54 88,46 Z"
        fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Left lapel (white) -->
  <path d="M86,58 Q80,80 76,100 L84,100 Q88,82 94,66 Z"
        fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <!-- Right lapel (white) -->
  <path d="M114,58 Q120,80 124,100 L116,100 Q112,82 106,66 Z"
        fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Left lapel fold / notch detail -->
  <path d="M76,100 L84,100 L80,108 Z" fill="#374151"/>
  <!-- Right lapel fold / notch detail -->
  <path d="M124,100 L116,100 L120,108 Z" fill="#374151"/>

  <!-- Left shoulder -->
  <path d="M38,70 Q38,56 52,52 L74,46 L78,60 Q64,58 50,66 Z" fill="#1F2937"/>
  <!-- Right shoulder -->
  <path d="M162,70 Q162,56 148,52 L126,46 L122,60 Q136,58 150,66 Z" fill="#1F2937"/>

  <!-- Jacket center front opening (V) -->
  <path d="M84,100 Q88,120 100,130 Q112,120 116,100" fill="#1F2937" opacity="0.5"/>

  <!-- Left front panel of jacket -->
  <path d="M38,100 L84,100 Q88,120 100,130 L100,168 L38,168 Z" fill="#272F3D" opacity="0.5"/>
  <!-- Right front panel of jacket -->
  <path d="M162,100 L116,100 Q112,120 100,130 L100,168 L162,168 Z" fill="#272F3D" opacity="0.5"/>

  <!-- Gold buttons -->
  <circle cx="100" cy="108" r="5.5" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="100" cy="108" r="2" fill="#D97706"/>
  <circle cx="100" cy="122" r="5.5" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="100" cy="122" r="2" fill="#D97706"/>

  <!-- White pocket square in breast pocket -->
  <rect x="128" y="88" width="18" height="12" rx="2" fill="#374151"/>
  <path d="M129,88 Q136,82 147,88" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <path d="M131,88 L131,86 Q136,82 141,86 L141,88" fill="white"/>

  <!-- Black bow tie -->
  <!-- Left wing -->
  <path d="M88,76 Q84,72 86,68 Q94,68 100,74 Z" fill="#111827" stroke="#374151" stroke-width="1"/>
  <!-- Right wing -->
  <path d="M112,76 Q116,72 114,68 Q106,68 100,74 Z" fill="#111827" stroke="#374151" stroke-width="1"/>
  <!-- Center knot -->
  <ellipse cx="100" cy="74" rx="6" ry="5" fill="#374151" stroke="#111827" stroke-width="1"/>

  <!-- Shirt buttons on white panel -->
  <circle cx="100" cy="66" r="2" fill="#D1D5DB"/>
  <circle cx="100" cy="76" r="2" fill="#D1D5DB"/>

  <!-- Jacket stitching lines -->
  <path d="M44,70 L44,162" stroke="#374151" stroke-width="1" opacity="0.4" stroke-dasharray="4,8"/>
  <path d="M156,70 L156,162" stroke="#374151" stroke-width="1" opacity="0.4" stroke-dasharray="4,8"/>
</svg>
