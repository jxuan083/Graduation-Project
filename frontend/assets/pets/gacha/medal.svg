<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#FFFBEB"/>

  <!-- Ribbon -->
  <!-- Left ribbon half -->
  <polygon points="100,52 78,52 70,92 90,78" fill="#1D4ED8"/>
  <polygon points="100,52 78,52 70,92 90,78" fill="none" stroke="#1E40AF" stroke-width="1"/>
  <!-- Right ribbon half -->
  <polygon points="100,52 122,52 130,92 110,78" fill="#DC2626"/>
  <polygon points="100,52 122,52 130,92 110,78" fill="none" stroke="#B91C1C" stroke-width="1"/>
  <!-- Ribbon stripes -->
  <line x1="84" y1="52" x2="76" y2="88" stroke="white" stroke-width="3" opacity="0.4"/>
  <line x1="92" y1="52" x2="85" y2="84" stroke="white" stroke-width="3" opacity="0.4"/>
  <line x1="108" y1="52" x2="115" y2="84" stroke="white" stroke-width="3" opacity="0.4"/>
  <line x1="116" y1="52" x2="124" y2="88" stroke="white" stroke-width="3" opacity="0.4"/>
  <!-- Ribbon top knot -->
  <rect x="88" y="44" width="24" height="12" rx="5" fill="#374151"/>
  <rect x="90" y="46" width="20" height="8" rx="3" fill="#4B5563"/>

  <!-- Medal drop shadow -->
  <circle cx="102" cy="134" r="45" fill="#D97706" opacity="0.2"/>

  <!-- Medal circle -->
  <circle cx="100" cy="128" r="44" fill="#F59E0B" stroke="#D97706" stroke-width="3"/>
  <!-- Medal inner ring -->
  <circle cx="100" cy="128" r="38" fill="#FBBF24"/>
  <circle cx="100" cy="128" r="34" fill="#F59E0B"/>

  <!-- Laurel wreath -->
  <!-- Left leaves -->
  <ellipse cx="68" cy="128" rx="8" ry="4" fill="#34D399" transform="rotate(-30,68,128)"/>
  <ellipse cx="66" cy="118" rx="8" ry="4" fill="#34D399" transform="rotate(-50,66,118)"/>
  <ellipse cx="68" cy="108" rx="8" ry="4" fill="#34D399" transform="rotate(-70,68,108)"/>
  <ellipse cx="74" cy="100" rx="8" ry="4" fill="#34D399" transform="rotate(-90,74,100)"/>
  <ellipse cx="68" cy="138" rx="8" ry="4" fill="#34D399" transform="rotate(-10,68,138)"/>
  <ellipse cx="70" cy="148" rx="8" ry="4" fill="#34D399" transform="rotate(10,70,148)"/>
  <ellipse cx="75" cy="156" rx="8" ry="4" fill="#34D399" transform="rotate(30,75,156)"/>
  <!-- Right leaves -->
  <ellipse cx="132" cy="128" rx="8" ry="4" fill="#34D399" transform="rotate(30,132,128)"/>
  <ellipse cx="134" cy="118" rx="8" ry="4" fill="#34D399" transform="rotate(50,134,118)"/>
  <ellipse cx="132" cy="108" rx="8" ry="4" fill="#34D399" transform="rotate(70,132,108)"/>
  <ellipse cx="126" cy="100" rx="8" ry="4" fill="#34D399" transform="rotate(90,126,100)"/>
  <ellipse cx="132" cy="138" rx="8" ry="4" fill="#34D399" transform="rotate(10,132,138)"/>
  <ellipse cx="130" cy="148" rx="8" ry="4" fill="#34D399" transform="rotate(-10,130,148)"/>
  <ellipse cx="125" cy="156" rx="8" ry="4" fill="#34D399" transform="rotate(-30,125,156)"/>

  <!-- Medal face -->
  <circle cx="100" cy="128" r="28" fill="#FBBF24"/>

  <!-- Star emblem on medal -->
  <polygon points="100,105 104.5,120 120,120 107.5,129 112,144 100,135 88,144 92.5,129 80,120 95.5,120"
           fill="#D97706" stroke="#B45309" stroke-width="1"/>
  <polygon points="100,109 103.5,120 115,120 106,127 109.5,138 100,132 90.5,138 94,127 85,120 96.5,120"
           fill="#FDE68A"/>

  <!-- Radiating lines from center (behind star, overdrawn partially) -->
  <line x1="100" y1="100" x2="100" y2="88" stroke="#FBBF24" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="156" x2="100" y2="168" stroke="#FBBF24" stroke-width="2" opacity="0.6"/>
  <line x1="66" y1="128" x2="54" y2="128" stroke="#FBBF24" stroke-width="2" opacity="0.6"/>
  <line x1="134" y1="128" x2="146" y2="128" stroke="#FBBF24" stroke-width="2" opacity="0.6"/>
</svg>
