<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#EDE9FE"/>

  <!-- Hat shadow -->
  <ellipse cx="102" cy="162" rx="52" ry="9" fill="#4C1D95" opacity="0.2"/>

  <!-- Wide brim shadow -->
  <ellipse cx="100" cy="150" rx="66" ry="13" fill="#2E1065" opacity="0.25"/>

  <!-- Wide brim -->
  <ellipse cx="100" cy="148" rx="68" ry="14" fill="#1E1B4B" stroke="#312E81" stroke-width="2"/>
  <!-- Brim highlight -->
  <ellipse cx="100" cy="144" rx="62" ry="8" fill="#312E81" opacity="0.6"/>

  <!-- Hat cone body with gradient effect -->
  <path d="M103,38 L62,145 L138,145 Z" fill="#4C1D95"/>
  <path d="M103,38 L70,145 L138,145 Z" fill="#6D28D9" opacity="0.7"/>
  <path d="M103,38 L80,145 L115,145 Z" fill="#7C3AED" opacity="0.5"/>
  <!-- Cone outline -->
  <path d="M103,38 L62,145 L138,145 Z" fill="none" stroke="#312E81" stroke-width="2" stroke-linejoin="round"/>

  <!-- Hat band/buckle at base of cone -->
  <rect x="68" y="136" width="66" height="12" rx="4" fill="#1E1B4B"/>
  <rect x="90" y="133" width="22" height="18" rx="3" fill="#374151" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="94" y="137" width="14" height="10" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Stars and crescent on hat -->
  <!-- Large crescent moon -->
  <circle cx="85" cy="95" r="12" fill="#FBBF24"/>
  <circle cx="90" cy="91" r="10" fill="#4C1D95"/>

  <!-- Stars on hat -->
  <!-- 4-pt star 1 -->
  <path d="M118,80 L120,86 L118,92 L116,86 Z" fill="#E5E7EB"/>
  <path d="M118,86 L124,84 L118,82 L112,84 Z" fill="#E5E7EB"/>
  <!-- 4-pt star 2 (small) -->
  <path d="M128,112 L129.5,116 L128,120 L126.5,116 Z" fill="#C4B5FD"/>
  <path d="M128,116 L132,114 L128,112 L124,114 Z" fill="#C4B5FD"/>
  <!-- 4-pt star 3 (tiny) -->
  <path d="M76,68 L77,71 L76,74 L75,71 Z" fill="#E5E7EB" opacity="0.8"/>
  <path d="M76,71 L79,69.5 L76,68 L73,69.5 Z" fill="#E5E7EB" opacity="0.8"/>
  <!-- 4-pt star 4 -->
  <path d="M110,55 L111.5,59 L110,63 L108.5,59 Z" fill="#FDE68A" opacity="0.9"/>
  <path d="M110,59 L114,57 L110,55 L106,57 Z" fill="#FDE68A" opacity="0.9"/>

  <!-- Tip of hat -->
  <circle cx="103" cy="38" r="4" fill="#A78BFA"/>
</svg>
