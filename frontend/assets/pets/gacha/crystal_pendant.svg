<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#EFF6FF"/>

  <!-- Gold chain arc -->
  <!-- Chain drawn as dashed arc -->
  <path d="M55,72 Q100,42 145,72" fill="none" stroke="#F59E0B" stroke-width="3"
        stroke-dasharray="6,4" stroke-linecap="round"/>
  <!-- Chain end caps -->
  <circle cx="55" cy="72" r="5" fill="#D97706" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="145" cy="72" r="5" fill="#D97706" stroke="#B45309" stroke-width="1.5"/>

  <!-- Chain to pendant -->
  <line x1="100" y1="52" x2="100" y2="80" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5,3"/>
  <!-- Small gold bail/jump ring -->
  <ellipse cx="100" cy="80" rx="7" ry="5" fill="none" stroke="#D97706" stroke-width="2.5"/>

  <!-- Crystal glow -->
  <ellipse cx="100" cy="135" rx="30" ry="40" fill="#BFDBFE" opacity="0.3"/>

  <!-- Main teardrop crystal -->
  <!-- Outer crystal shape -->
  <path d="M100,86 L128,138 Q128,170 100,170 Q72,170 72,138 Z"
        fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/>
  <!-- Crystal inner facets -->
  <path d="M100,86 L128,138 L100,155 Z" fill="#93C5FD" opacity="0.6"/>
  <path d="M100,86 L72,138 L100,155 Z" fill="#DBEAFE" opacity="0.5"/>
  <path d="M100,86 L115,118 L100,110 Z" fill="white" opacity="0.5"/>
  <path d="M100,86 L85,118 L100,110 Z" fill="#BFDBFE" opacity="0.4"/>
  <!-- Crystal center highlight -->
  <path d="M100,100 L110,125 L100,120 L90,125 Z" fill="white" opacity="0.6"/>
  <!-- Inner gem depth -->
  <path d="M86,118 L100,155 L114,118 L100,145 Z" fill="#60A5FA" opacity="0.3"/>

  <!-- Refraction lines inside crystal -->
  <line x1="90" y1="96" x2="85" y2="140" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="110" y1="96" x2="118" y2="135" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="97" y1="90" x2="92" y2="160" stroke="white" stroke-width="1" opacity="0.3"/>

  <!-- Sparkle at crystal tip top -->
  <path d="M100,86 L101.5,80 L100,74 L98.5,80 Z" fill="white" opacity="0.9"/>
  <path d="M100,80 L106,78 L100,76 L94,78 Z" fill="white" opacity="0.9"/>

  <!-- Side sparkles -->
  <path d="M68,110 L70,114 L68,118 L66,114 Z" fill="#93C5FD" opacity="0.8"/>
  <path d="M68,114 L72,112 L68,110 L64,112 Z" fill="#93C5FD" opacity="0.8"/>
  <path d="M132,110 L134,114 L132,118 L130,114 Z" fill="#93C5FD" opacity="0.8"/>
  <path d="M132,114 L136,112 L132,110 L128,112 Z" fill="#93C5FD" opacity="0.8"/>

  <!-- Bottom tip sparkle -->
  <circle cx="100" cy="170" r="4" fill="#BFDBFE" opacity="0.9"/>
  <path d="M100,164 L101,168 L100,172 L99,168 Z" fill="white" opacity="0.7"/>
</svg>
