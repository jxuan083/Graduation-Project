<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#FEF3C7"/>

  <!-- Drop shadow -->
  <ellipse cx="100" cy="162" rx="38" ry="8" fill="#D97706" opacity="0.18"/>

  <!-- Hat cone body -->
  <polygon points="100,32 60,155 140,155" fill="#F5B731"/>
  <!-- Stripe 1 (pink) -->
  <clipPath id="cone-clip">
    <polygon points="100,32 60,155 140,155"/>
  </clipPath>
  <g clip-path="url(#cone-clip)">
    <!-- diagonal stripes: pink and purple -->
    <line x1="60" y1="80" x2="120" y2="30" stroke="#EC4899" stroke-width="13" opacity="0.85"/>
    <line x1="68" y1="110" x2="140" y2="52" stroke="#EC4899" stroke-width="13" opacity="0.85"/>
    <line x1="60" y1="140" x2="140" y2="80" stroke="#EC4899" stroke-width="13" opacity="0.85"/>
    <line x1="80" y1="156" x2="140" y2="112" stroke="#EC4899" stroke-width="13" opacity="0.85"/>
    <line x1="60" y1="80" x2="120" y2="30" stroke="#A855F7" stroke-width="6" opacity="0.7"/>
    <line x1="68" y1="110" x2="140" y2="52" stroke="#A855F7" stroke-width="6" opacity="0.7"/>
    <line x1="60" y1="140" x2="140" y2="80" stroke="#A855F7" stroke-width="6" opacity="0.7"/>
    <line x1="80" y1="156" x2="140" y2="112" stroke="#A855F7" stroke-width="6" opacity="0.7"/>
  </g>
  <!-- Cone outline -->
  <polygon points="100,32 60,155 140,155" fill="none" stroke="#C45220" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Base band -->
  <rect x="58" y="150" width="84" height="10" rx="5" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>

  <!-- Hanging strings -->
  <path d="M72,160 Q62,172 60,180" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M128,160 Q136,172 138,180" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="60" cy="181" r="3" fill="#EC4899"/>
  <circle cx="138" cy="181" r="3" fill="#A855F7"/>

  <!-- Pompom on top -->
  <circle cx="100" cy="30" r="13" fill="white" opacity="0.9"/>
  <circle cx="94" cy="26" r="5" fill="white"/>
  <circle cx="106" cy="25" r="4" fill="white"/>
  <circle cx="99" cy="37" r="4.5" fill="white"/>
  <circle cx="107" cy="33" r="4" fill="white"/>
  <circle cx="92" cy="34" r="3.5" fill="white"/>
  <circle cx="100" cy="30" r="11" fill="white" opacity="0.6"/>

  <!-- Confetti dots -->
  <circle cx="58" cy="68" r="4" fill="#EC4899" opacity="0.8"/>
  <circle cx="148" cy="85" r="3" fill="#A855F7" opacity="0.8"/>
  <circle cx="52" cy="110" r="3.5" fill="#34D399" opacity="0.8"/>
  <circle cx="152" cy="130" r="3" fill="#60A5FA" opacity="0.8"/>
  <circle cx="65" cy="47" r="2.5" fill="#FBBF24" opacity="0.9"/>
  <circle cx="142" cy="55" r="3" fill="#F472B6" opacity="0.8"/>
  <rect x="145" y="100" width="5" height="5" rx="1" fill="#F59E0B" opacity="0.7" transform="rotate(20,147,102)"/>
  <rect x="50" y="130" width="5" height="5" rx="1" fill="#A855F7" opacity="0.7" transform="rotate(35,52,132)"/>
</svg>
