<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#FEF2F2"/>

  <!-- Drop shadow -->
  <ellipse cx="100" cy="168" rx="52" ry="8" fill="#991B1B" opacity="0.15"/>

  <!-- Scarf main U-shape body -->
  <!-- Left arm of scarf -->
  <rect x="42" y="68" width="38" height="52" rx="19" fill="#DC2626"/>
  <!-- Right arm of scarf -->
  <rect x="120" y="68" width="38" height="52" rx="19" fill="#DC2626"/>
  <!-- Bottom curve connecting the two arms -->
  <path d="M61,110 Q61,145 100,145 Q139,145 139,110 L139,118 Q139,152 100,152 Q61,152 61,118 Z"
        fill="#DC2626"/>

  <!-- Plaid pattern - white horizontal lines on left arm -->
  <clipPath id="left-arm">
    <rect x="42" y="68" width="38" height="52" rx="19"/>
  </clipPath>
  <g clip-path="url(#left-arm)">
    <line x1="38" y1="80" x2="84" y2="80" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="38" y1="92" x2="84" y2="92" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="38" y1="104" x2="84" y2="104" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="38" y1="116" x2="84" y2="116" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="51" y1="64" x2="51" y2="124" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="63" y1="64" x2="63" y2="124" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="75" y1="64" x2="75" y2="124" stroke="white" stroke-width="3" opacity="0.6"/>
    <!-- Darker grid intersections -->
    <line x1="38" y1="80" x2="84" y2="80" stroke="#B91C1C" stroke-width="1.5" opacity="0.4"/>
    <line x1="38" y1="92" x2="84" y2="92" stroke="#B91C1C" stroke-width="1.5" opacity="0.4"/>
    <line x1="38" y1="104" x2="84" y2="104" stroke="#B91C1C" stroke-width="1.5" opacity="0.4"/>
    <line x1="38" y1="116" x2="84" y2="116" stroke="#B91C1C" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Plaid pattern - white lines on right arm -->
  <clipPath id="right-arm">
    <rect x="120" y="68" width="38" height="52" rx="19"/>
  </clipPath>
  <g clip-path="url(#right-arm)">
    <line x1="116" y1="80" x2="162" y2="80" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="116" y1="92" x2="162" y2="92" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="116" y1="104" x2="162" y2="104" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="116" y1="116" x2="162" y2="116" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="125" y1="64" x2="125" y2="124" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="137" y1="64" x2="137" y2="124" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="149" y1="64" x2="149" y2="124" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="116" y1="80" x2="162" y2="80" stroke="#B91C1C" stroke-width="1.5" opacity="0.4"/>
    <line x1="116" y1="92" x2="162" y2="92" stroke="#B91C1C" stroke-width="1.5" opacity="0.4"/>
    <line x1="116" y1="104" x2="162" y2="104" stroke="#B91C1C" stroke-width="1.5" opacity="0.4"/>
    <line x1="116" y1="116" x2="162" y2="116" stroke="#B91C1C" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Left hanging tail -->
  <rect x="46" y="118" width="30" height="44" rx="8" fill="#DC2626"/>
  <clipPath id="left-tail">
    <rect x="46" y="118" width="30" height="44" rx="8"/>
  </clipPath>
  <g clip-path="url(#left-tail)">
    <line x1="42" y1="130" x2="80" y2="130" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="42" y1="142" x2="80" y2="142" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="42" y1="154" x2="80" y2="154" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="55" y1="114" x2="55" y2="166" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="67" y1="114" x2="67" y2="166" stroke="white" stroke-width="3" opacity="0.6"/>
  </g>
  <!-- Fringe on left tail -->
  <line x1="50" y1="162" x2="48" y2="172" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="162" x2="55" y2="173" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="62" y1="162" x2="62" y2="173" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="162" x2="69" y2="173" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74" y1="162" x2="75" y2="172" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right hanging tail -->
  <rect x="124" y="118" width="30" height="44" rx="8" fill="#DC2626"/>
  <clipPath id="right-tail">
    <rect x="124" y="118" width="30" height="44" rx="8"/>
  </clipPath>
  <g clip-path="url(#right-tail)">
    <line x1="120" y1="130" x2="158" y2="130" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="120" y1="142" x2="158" y2="142" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="120" y1="154" x2="158" y2="154" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="133" y1="114" x2="133" y2="166" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="145" y1="114" x2="145" y2="166" stroke="white" stroke-width="3" opacity="0.6"/>
  </g>
  <!-- Fringe on right tail -->
  <line x1="128" y1="162" x2="126" y2="172" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="134" y1="162" x2="133" y2="173" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="140" y1="162" x2="140" y2="173" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="146" y1="162" x2="147" y2="173" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="152" y1="162" x2="153" y2="172" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
</svg>
