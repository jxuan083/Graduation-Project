<section id="view-more" class="view page-view">

    <div class="page-header">
        <button id="btn-more-back" class="btn-back" aria-label="返回">
            <svg width="16" height="13" viewBox="0 0 26 14.73" fill="none"><path d="M25 7.36H1M1 7.36L8 1M1 7.36L8 13.73" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="page-title">更多</span>
    </div>

    <div class="more-content">

        <div class="more-section">
            <h2 class="more-section-title">語言 · Language</h2>
            <div id="lang-toggle" class="lang-toggle more-lang" role="group" aria-label="Language">
                <button type="button" data-lang="zh" class="lang-btn active">中文</button>
                <button type="button" data-lang="en" class="lang-btn">English</button>
            </div>
        </div>

        <div class="diag">
            <h2 class="diag-title">連線診斷</h2>

            <dl class="diag-list" id="diag-env"></dl>

            <button id="diag-run" class="diag-btn diag-btn-primary" type="button">測試連線</button>
            <pre class="diag-output" id="diag-output" aria-live="polite">尚未測試</pre>
        </div>

        <!-- 動作偵測 spike（CMSensorRecorder 可行性驗證，實機專用；驗完會移除）-->
        <div class="diag" id="motion-spike">
            <h2 class="diag-title">動作偵測測試（實機）</h2>
            <button id="motion-check" class="diag-btn" type="button">① 檢查支援</button>
            <button id="motion-start" class="diag-btn diag-btn-primary" type="button">② 開始錄 30 秒</button>
            <button id="motion-read" class="diag-btn" type="button">③ 讀取結果</button>
            <pre class="diag-output" id="motion-output" aria-live="polite">在實體 iPhone 上依序按 ①②③。②之後把手機面朝下放桌上、期間拿起幾次，30 秒後按③。</pre>
        </div>

        <!-- 走動查詢（戶外情境走動修正）：iPhone 本來就在背景記步數，直接查歷史，不用先開始錄 -->
        <div class="diag" id="movement-spike">
            <h2 class="diag-title">走動查詢（實機）</h2>
            <div class="diag-row">
                <button class="diag-btn" type="button" data-movement-min="5">過去 5 分鐘</button>
                <button class="diag-btn" type="button" data-movement-min="30">過去 30 分鐘</button>
                <button class="diag-btn" type="button" data-movement-min="60">過去 60 分鐘</button>
            </div>
            <pre class="diag-output" id="movement-output" aria-live="polite">先走一走再按。第一次會跳「動作與健身」權限（已允許過就不會再跳）。</pre>
        </div>

        <!-- Pickup 偵測（實機）：拿起手機的次數與「無心 / 不確定 / 潛在分心」判斷，全程在手機上分析 -->
        <div class="diag" id="pickup-test">
            <h2 class="diag-title">Pickup 偵測（實機）</h2>
            <label class="pk-ctx">情境
                <select id="pickup-context">
                    <option value="general">一般</option>
                    <option value="outdoor">戶外活動</option>
                </select>
            </label>
            <p class="pk-help">自由測試：先按「開始錄」，像平常一樣把手機放著、拿起幾次，之後再按「分析」。錄製期間可以鎖螢幕。</p>
            <div class="diag-row">
                <button class="diag-btn" type="button" data-pickup-record="3">開始錄 3 分鐘</button>
                <button class="diag-btn" type="button" data-pickup-record="10">開始錄 10 分鐘</button>
            </div>
            <div class="diag-row">
                <button class="diag-btn" type="button" data-pickup-analyze="3">分析最近 3 分鐘</button>
                <button class="diag-btn" type="button" data-pickup-analyze="10">分析最近 10 分鐘</button>
            </div>
            <p class="pk-help">腳本測試（約 3.5 分鐘）：會用語音和震動提示每一步，結束後自動算準確率。請先關掉靜音、把音量調大。</p>
            <button id="pickup-script" class="diag-btn diag-btn-primary" type="button">開始腳本測試</button>
            <pre class="diag-output" id="pickup-output" aria-live="polite">尚未測試</pre>
            <button id="pickup-copy" class="diag-btn" type="button">複製結果（貼給開發者）</button>
        </div>

    </div>

</section>
