<section id="view-summary" class="view">
    <div class="ps-top-strip"></div>

    <div class="ps-body">
        <p class="ps-pre-title">PARTY RECAP</p>
        <p class="ps-title">聚會總結</p>

        <!-- 吉祥物卡 -->
        <div class="ps-mascot-card">
            <!-- 場景由 renderSummaryPet() 從「聚會中」的場景卡複製進來（沿用當場情境＋當場寵物）。
                 下面是 fallback：沒有可複製的場景時顯示預設坐位吉祥物（球），絕不再用獅子。 -->
            <div class="ps-mascot-scene" id="summary-mascot-scene">
                <div class="pa-seat-ball" aria-hidden="true" style="position:absolute;left:50%;bottom:14px;width:80px;height:80px;transform:translateX(-50%);z-index:2;">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <radialGradient id="summary-ball-body" cx="0.4" cy="0.35" r="0.75">
                                <stop offset="0" stop-color="#ffe9c9"/><stop offset="1" stop-color="#eec38f"/>
                            </radialGradient>
                        </defs>
                        <circle cx="50" cy="50" r="34" fill="url(#summary-ball-body)"/>
                        <circle cx="39" cy="47" r="4.2" fill="#4a3526"/>
                        <circle cx="61" cy="47" r="4.2" fill="#4a3526"/>
                        <circle cx="40.4" cy="45.6" r="1.3" fill="#fff"/>
                        <circle cx="62.4" cy="45.6" r="1.3" fill="#fff"/>
                        <path d="M43 59 Q50 65 57 59" stroke="#4a3526" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <circle cx="32" cy="56" r="4.5" fill="#f2a878" opacity=".55"/>
                        <circle cx="68" cy="56" r="4.5" fill="#f2a878" opacity=".55"/>
                    </svg>
                </div>
            </div>
            <div class="ps-mascot-text">
                <span id="summary-mascot-message">大家今天都很棒，繼續保持！</span>
                <span id="summary-pet-xp" class="ps-pet-xp" style="display:none;"></span>
            </div>
        </div>

        <!-- 統計（真實資料：時長 + 我的分數 + 我的分心次數 + 參與人數） -->
        <div class="ps-stats">
            <div class="ps-stat-card"><p class="ps-stat-val" id="summary-time">0</p><p class="ps-stat-label">分鐘</p></div>
            <div class="ps-stat-card"><p class="ps-stat-val" id="summary-score">0</p><p class="ps-stat-label">我的分數</p></div>
            <div class="ps-stat-card"><p class="ps-stat-val" id="summary-deviations">0</p><p class="ps-stat-label">次分心（我）</p></div>
            <div class="ps-stat-card"><p class="ps-stat-val" id="summary-member-count">0</p><p class="ps-stat-label">人參與</p></div>
        </div>
        <p id="summary-host-hint" style="display:none;"></p>

        <!-- 聚會分數排行（由 wsHandlers 填入 #summary-score-list） -->
        <div class="ps-rank-section" id="summary-score-ranking" style="display:none;">
            <p class="ps-rank-label">聚會分數排行</p>
            <ul id="summary-score-list"></ul>
        </div>
    </div>

    <div class="ps-footer">
        <button id="btn-summary-rejoin" class="btn-secondary" type="button" style="display:none;">加回聚會</button>
        <button id="btn-summary-home" class="btn-primary" type="button">回到首頁</button>
    </div>
</section>
