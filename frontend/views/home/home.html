<section id="view-home" class="view active">

    <!-- 好友邀請提示橫幅（chrome.js 控制顯示） -->
    <div id="incoming-banner" class="incoming-banner" style="display:none;">
        <div class="incoming-banner-icon"><i data-lucide="mail"></i></div>
        <div class="incoming-banner-text">
            <div class="incoming-banner-title">你有 <span id="incoming-banner-count">0</span> 筆好友邀請待處理</div>
            <div id="incoming-banner-sub" class="incoming-banner-sub"></div>
        </div>
        <button id="btn-incoming-banner-view" class="btn-mini primary">查看</button>
    </div>

    <!-- 頂列：品牌與題庫（右上帳號由常駐 auth chip 顯示） -->
    <div class="top-row">
        <div class="home-brand">
            <span class="home-brand-mark" aria-hidden="true"><i data-lucide="flame-kindling"></i></span>
            <span>Phubbing Anchor</span>
            <button id="btn-home-replay-onboarding" class="home-replay-guide" type="button" aria-label="重看新手教學">
                <i data-lucide="help-circle"></i>
            </button>
        </div>
        <button id="btn-question-library" class="btn-book" aria-label="題庫管理">
            <svg width="20" height="24" viewBox="0 0 20 24" fill="none">
                <path d="M2 2h13a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2H2" stroke="#4f351a" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M2 2a1 1 0 0 0-1 1v18a1 1 0 0 0 1 1h13" stroke="#4f351a" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M5 8h8M5 12h8M5 16h5" stroke="#4f351a" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </button>
    </div>

    <!-- 首次啟動對話式 onboarding；看過後 home.js 會移除，不佔版面 -->
    <section id="home-purpose" class="home-purpose home-onboarding" aria-labelledby="home-onboarding-title">
        <div class="home-onboarding-head">
            <div class="home-onboarding-pet" aria-hidden="true">
                <img src="./views/pet-swap/assets/dog.png" alt="">
            </div>
            <div>
                <p class="home-onboarding-kicker"><i data-lucide="users-round"></i> 讓手機成為連結</p>
                <h1 id="home-onboarding-title">Phubbing Anchor</h1>
            </div>
            <button id="btn-home-onboarding-skip" class="home-onboarding-skip" type="button">跳過</button>
        </div>
        <template id="home-onboarding-steps">
            <p>你好，我是你們的群組寵物。</p>
            <p>手機可以留在手上，注意力留在彼此身上。</p>
            <p>Phubbing Anchor 會幫你發起聚會、邀請夥伴、一起完成定錨。只要更了解彼此，這場聚會就有意義。</p>
            <p>開始很簡單：揪齊夥伴 → 一起定錨 → 專心相聚。</p>
            <p>你可以現在發起聚會，或加入朋友的聚會。</p>
        </template>
        <div id="home-onboarding-messages" class="home-onboarding-messages" aria-live="polite"></div>
        <div id="home-onboarding-actions" class="home-onboarding-actions" hidden>
            <button id="btn-home-onboarding-create" class="home-onboarding-primary" type="button">
                <i data-lucide="plus"></i>
                <span>發起聚會</span>
            </button>
            <button id="btn-home-onboarding-join" class="home-onboarding-secondary" type="button">
                <i data-lucide="log-in"></i>
                <span>加入聚會</span>
            </button>
        </div>
        <button id="btn-home-onboarding-next" class="home-onboarding-next" type="button">繼續</button>
    </section>

    <!-- 搜尋 -->
    <div class="search-row">
        <div class="search-bar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;">
                <circle cx="11" cy="11" r="7" stroke="#9b7955" stroke-width="1.8"/>
                <path d="M16.5 16.5L21 21" stroke="#9b7955" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input id="home-search" type="text" placeholder="搜尋群組…" autocomplete="off">
        </div>
    </div>

    <div class="home-groups-heading">
        <div>
            <p>我的群組</p>
            <span>你加入或建立的聚會群組會出現在這裡</span>
        </div>
    </div>

    <!-- 群組九宮格（由 home.js 依 /api/groups 動態渲染） -->
    <div class="groups-scroll">
        <div class="groups-grid" id="home-groups-grid"></div>
        <div class="home-empty" id="home-groups-empty" style="display:none;">
            <div class="home-empty-visual"><i data-lucide="users-round"></i></div>
            <p class="home-empty-title">還沒有任何群組</p>
            <p class="home-empty-desc">點下方「群組」建立或加入一個群組，<br>揪朋友一起放下手機聚一聚吧！</p>
        </div>
        <div class="home-empty" id="home-groups-guest" style="display:none;">
            <div class="guest-start-panel">
                <div class="guest-start-copy">
                    <span class="guest-start-label">登入後開始</span>
                    <h2>保存你的群組與聚會回顧。</h2>
                    <p>本機開發環境可直接用 emulator 快速登入。</p>
                </div>
                <div class="guest-start-actions">
                    <button id="btn-home-google-login" class="guest-primary-action" type="button">
                        <i data-lucide="log-in"></i>
                        登入
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
