<section id="view-meeting-news" class="view">
    <div class="mn-paper">
        <div class="mn-scroll">
            <header class="mn-masthead">
                <div class="mn-issue-row">
                    <span id="mn-volume">VOL. 1 · NO. 001</span>
                    <span id="mn-date">-</span>
                </div>
                <h1>THE GATHERING</h1>
                <p class="mn-post">POST</p>
            </header>

            <div class="mn-band">★ PARTY REPORT ★</div>

            <!-- 大標題由 Prompt A 產生（兩行）；副標固定句型 -->
            <section class="mn-headline-block">
                <h2 id="mn-headline">聚會圓滿落幕</h2>
                <p id="mn-subhead">本次聚會回顧報已生成</p>
            </section>

            <!-- 主圖：有照片放照片（群組寵物疊在不擋到人的位置）；沒照片放聚會中的情境場景＋寵物 -->
            <section class="mn-hero">
                <figure id="mn-hero-photo-wrap" class="mn-hero-photo-wrap" hidden>
                    <img id="mn-hero-img" alt="聚會照片">
                    <img id="mn-hero-pet" class="mn-hero-pet" alt="" hidden>
                </figure>
                <div id="mn-scene" class="pa-scene-card has-scene" hidden>
                    <img id="mn-scene-pet" class="pa-pet-face" alt="" hidden>
                </div>
                <p id="mn-hero-caption"><img id="mn-caption-pet" class="mn-caption-pet" alt="" hidden><span id="mn-hero-caption-text"></span></p>
            </section>

            <!-- 兩欄內文由 Prompt B 產生（段落數不固定） -->
            <section id="mn-article" class="mn-article"></section>

            <section id="mn-gallery-section" class="mn-gallery-section">
                <div class="mn-thin-rule"></div>
                <p class="mn-section-title">── 現場紀錄 ──</p>
                <div id="mn-gallery" class="mn-gallery"></div>
            </section>

            <section class="mn-stats-section">
                <p class="mn-section-title">── 本次聚會數據 ──</p>
                <div class="mn-stats">
                    <div>
                        <span id="mn-duration" class="mn-stat-value">0</span>
                        <span class="mn-stat-unit">分鐘</span>
                        <span class="mn-stat-label">總時長</span>
                    </div>
                    <div>
                        <span id="mn-member-count" class="mn-stat-value">0</span>
                        <span class="mn-stat-unit">人</span>
                        <span class="mn-stat-label">參與者</span>
                    </div>
                    <div>
                        <span id="mn-total-distractions" class="mn-stat-value">0</span>
                        <span class="mn-stat-unit">次</span>
                        <span class="mn-stat-label">總分心</span>
                    </div>
                    <div>
                        <span id="mn-longest-focus" class="mn-stat-value">—</span>
                        <span class="mn-stat-unit">分鐘</span>
                        <span class="mn-stat-label">最長連續專注</span>
                    </div>
                </div>
            </section>

            <section class="mn-roster-section">
                <p class="mn-section-title">── 出席名單 ──</p>
                <div id="mn-roster" class="mn-roster"></div>
            </section>

        </div>

        <div class="mn-home-bar">
            <button id="btn-meeting-news-home" type="button">返回首頁</button>
        </div>
    </div>
</section>
