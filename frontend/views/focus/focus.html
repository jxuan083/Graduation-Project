                <button class="pa-quick-btn" id="btn-game-zone" type="button">
                    <span class="qi" style="background:rgba(155,121,85,0.13);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9b7955" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15.5" y1="11" x2="15.51" y2="11"/><line x1="18" y1="13.5" x2="18.01" y2="13.5"/></svg>
                    </span>
                    <span class="ql">遊戲區</span>
                </button>
            </div>
            <button class="pa-quick-btn" id="btn-photo-zone" type="button">
                <span class="qi" style="background:rgba(60,150,100,0.11);">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3a9464" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </span>
                <span class="ql">拍照</span>
            </button>
            <button class="pa-quick-btn" id="btn-focus-record-reveal" type="button">
                <span class="qi" style="background:rgba(155,121,85,0.10);">
                    <svg width="18" height="20" viewBox="0 0 24 28" fill="none"><rect x="8" y="1" width="8" height="16" rx="4" fill="#9b7955"/><path d="M4 14a8 8 0 0016 0" stroke="#9b7955" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="12" y1="22" x2="12" y2="27" stroke="#9b7955" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="27" x2="16" y2="27" stroke="#9b7955" stroke-width="2" stroke-linecap="round"/></svg>
                </span>
                <span class="ql">錄音</span>
            </button>
        </div>
        <input id="meeting-camera-input" type="file" accept="image/*" capture="environment" style="display:none;" />
        <input id="meeting-album-input" type="file" accept="image/*" style="display:none;" />

        <!-- 錄音面板（預設收合） -->
        <div class="pa-record-panel" id="focus-record-panel" style="display:none;">
            <div class="pa-record-panel-header">
                <div>
                    <p class="pa-record-panel-title">LIVE TRANSCRIPT</p>
                    <p class="pa-record-panel-sub">即時語音轉文字</p>
                </div>
                <button class="pa-record-close" id="btn-focus-record-close" type="button" aria-label="收合">×</button>
            </div>
            <button class="pa-record-toggle" id="btn-live-transcript-toggle" type="button">
                <i data-lucide="mic"></i> 開始錄音
            </button>
            <div class="pa-record-options">
                <select id="live-transcript-language" class="compact-select" aria-label="語音語言">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                    <option value="">自動偵測</option>
                </select>
                <input id="live-transcript-speakers" class="compact-number" type="number" min="1" max="12" placeholder="人數" aria-label="說話者人數" />
            </div>
            <p id="live-transcript-status" class="pa-record-hint">開始後會即時顯示預覽，並每 8 秒用 Whisper 轉錄一次。</p>
            <div id="live-transcript-preview" class="live-transcript-preview" style="display:none;">
                <strong>即時預覽</strong>
                <span id="live-transcript-preview-text"></span>
            </div>
            <div id="live-transcript-list" class="live-transcript-list"></div>
        </div>

    </div>

    <!-- 結束聚會 -->
    <div class="pa-footer">
        <button class="btn-primary orange" id="btn-end-session" type="button">結束聚會</button>
    </div>

    <!-- 離開／結束：底部彈出選單（樣式同遊戲區／拍照選單）。
         主持人：結束整場，或自己先離開（主持自動交給目前最專心的人）；其他人：只離開自己，其他人繼續 -->
    <div id="leave-sheet" class="pa-sheet hidden" role="dialog" aria-modal="true" aria-label="離開聚會">
        <div class="pa-sheet-panel">
            <div class="pa-sheet-grip"></div>
            <p class="pa-sheet-title" id="leave-sheet-title">離開聚會</p>
            <button class="pa-sheet-item" id="btn-leave-end-all" type="button">
                <span class="pa-sheet-item-icon" style="background:rgba(224,120,48,0.12);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e07830" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                </span>
                <span class="pa-sheet-item-text"><strong>結束整場聚會</strong><small>所有人一起結算</small></span>
            </button>
            <button class="pa-sheet-item" id="btn-leave-self" type="button">
                <span class="pa-sheet-item-icon" style="background:rgba(155,121,85,0.13);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9b7955" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </span>
                <span class="pa-sheet-item-text"><strong id="leave-self-title">離開聚會</strong><small id="leave-self-note">分數算到現在，其他人繼續</small></span>
            </button>
            <button class="pa-sheet-cancel" id="btn-leave-sheet-cancel" type="button">取消</button>
        </div>
    </div>

    <!-- 遊戲區：底部彈出選單（選項按鈕沿用原 id，功能不變） -->
    <div id="game-sheet" class="pa-sheet hidden" role="dialog" aria-modal="true" aria-label="遊戲區">
        <div class="pa-sheet-panel">
            <div class="pa-sheet-grip"></div>
            <p class="pa-sheet-title">選擇遊戲</p>
            <button class="pa-sheet-item" id="btn-mode-qa" type="button">
                <span class="pa-sheet-item-icon" style="background:rgba(155,121,85,0.13);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9b7955" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                </span>
                <span class="pa-sheet-item-text"><strong>發起團體問答</strong><small>抽一題，大家一起回答</small></span>
            </button>
            <button class="pa-sheet-item" id="btn-mode-taboo" type="button">
                <span class="pa-sheet-item-icon" style="background:rgba(173,87,147,0.12);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ad5793" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                </span>
                <span class="pa-sheet-item-text"><strong>發起關鍵字遊戲</strong><small>限時猜字卡</small></span>
            </button>
            <button class="pa-sheet-cancel" id="btn-game-sheet-cancel" type="button">取消</button>
        </div>
    </div>

    <!-- 拍照：底部彈出選單 -->
    <div id="photo-sheet" class="pa-sheet hidden" role="dialog" aria-modal="true" aria-label="拍照">
        <div class="pa-sheet-panel">
            <div class="pa-sheet-grip"></div>
            <p class="pa-sheet-title">拍照留念</p>
            <button class="pa-sheet-item" id="btn-meeting-camera" type="button">
                <span class="pa-sheet-item-icon" style="background:rgba(60,150,100,0.11);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a9464" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </span>
                <span class="pa-sheet-item-text"><strong>開啟相機</strong><small>當場拍一張</small></span>
            </button>
            <button class="pa-sheet-item" id="btn-meeting-album" type="button">
                <span class="pa-sheet-item-icon" style="background:rgba(74,127,193,0.11);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a7fc1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="#4a7fc1"/><polyline points="21 15 16 10 5 21"/></svg>
                </span>
                <span class="pa-sheet-item-text"><strong>從相簿選擇</strong><small>挑一張既有照片</small></span>
            </button>
            <button class="pa-sheet-cancel" id="btn-photo-sheet-cancel" type="button">取消</button>
        </div>
    </div>

    <!-- 意圖宣告：先寫下要做什麼（只有自己看得到），再換一段不算分心的暫離窗口 -->
    <div id="intent-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="intent-modal-title">
        <div class="invite-card intent-card">
            <button id="btn-intent-modal-close" class="modal-close-x" type="button" aria-label="關閉"><i data-lucide="x"></i></button>
            <h3 id="intent-modal-title">要去做什麼?</h3>
            <p class="hint">寫一句提醒自己（只有你看得到）。這段時間不會被算成分心。</p>
            <input id="intent-reason-input" class="text-input intent-reason-input" type="text" maxlength="30" placeholder="例如：回一下工作訊息" autocomplete="off" />
            <div class="intent-modal-actions">
                <button id="btn-intent-cancel" class="btn secondary" type="button">取消</button>
                <button id="btn-intent-confirm" class="btn primary orange" type="button">開始暫離</button>
            </div>
        </div>
    </div>

    <!-- 電腦網頁鏡頭（手機用原生相機，不會顯示這個） -->
    <div id="meeting-camera-modal" class="mc-cam-modal" style="display:none;">
        <video id="mc-cam-video" class="mc-cam-video" autoplay playsinline muted></video>
        <div class="mc-cam-bar">
            <button id="mc-cam-cancel" class="mc-cam-cancel" type="button">取消</button>
            <button id="mc-cam-shoot" class="mc-cam-shoot" type="button" aria-label="拍照"></button>
            <span class="mc-cam-spacer"></span>
        </div>
    </div>
</section>
