<section id="view-leaderboard" class="view page-view">

    <div class="page-header">
        <button id="btn-leaderboard-back" class="btn-back" aria-label="返回">
            <svg width="16" height="13" viewBox="0 0 26 14.73" fill="none"><path d="M25 7.36H1M1 7.36L8 1M1 7.36L8 13.73" stroke="#4f351a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="page-title">排行榜</span>
    </div>

    <div class="tab-underline-bar">
        <button id="lb-tab-global" class="tab-underline-btn active" type="button">全站週榜</button>
        <button id="lb-tab-friends" class="tab-underline-btn" type="button">好友圈</button>
    </div>

    <div class="lb-scroll scroll-body">
        <p class="lb-week-hint" id="leaderboard-period-hint">本週</p>
        <div id="leaderboard-list" class="lb-list"></div>
        <p id="leaderboard-empty" class="hint" style="display:none; text-align:center; margin-top:32px;">本週還沒有人聚會喔</p>

        <div class="lb-gacha-banner">
            <div class="lb-gacha-banner-left">
                <span class="lb-gacha-icon" aria-hidden="true">🎰</span>
                <div>
                    <div class="lb-gacha-banner-title">扭蛋機</div>
                    <div class="lb-gacha-banner-desc">第 1 名 +50 金幣 · 第 2 名 +30 · 其他 +20 · 去寵物頁抽</div>
                </div>
            </div>
            <button class="lb-gacha-btn" id="btn-lb-open-gacha" type="button">去抽</button>
        </div>
    </div>

</section>
