<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寵物造型預覽 · Phubbing Anchor</title>
<style>
  :root{color-scheme:light;font-family:"Iowan Old Style","Songti TC",serif;color:#3e4335;background:#f4f1e9}
  *{box-sizing:border-box}body{margin:0;padding:44px 24px}main{max-width:1000px;margin:auto}
  header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d8d8cb;padding-bottom:16px}
  header a{color:inherit;font:13px system-ui;text-decoration:none}header span{font:11px system-ui;letter-spacing:.17em;color:#6b735e}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:48px;align-items:center;padding-top:34px}
  h1{font-size:40px;font-weight:500;margin:0 0 18px;letter-spacing:-.04em}p{font:14px/1.8 system-ui;color:#717565}
  .stage{position:relative;height:530px;border-radius:48% 48% 20px 20px;overflow:hidden;background:#e1dfcf url('./assets/pet-scenes/morning-sunroom.jpg') center/cover}
  #viewer{position:absolute;inset:0}.stage::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 -30px 70px -50px #4b3f28}
  .speech{position:absolute;top:30px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fffdf3e8;border:1px solid #fff8;padding:10px 18px;border-radius:18px;font:13px system-ui;z-index:2;color:#5f654f}
  .eyebrow{font:11px system-ui;letter-spacing:.12em;color:#81876e;margin-bottom:14px}
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
  button,.upload{font:13px system-ui;color:#48563c;border:1px solid #c9cebc;background:transparent;border-radius:12px;padding:13px 8px;cursor:pointer;text-align:center;transition:background .15s,transform .15s}
  button:active,.upload:active{transform:scale(.97)}button:focus-visible,.upload:focus-within{outline:2px solid #63754f;outline-offset:3px}
  @media(hover:hover){button:hover,.upload:hover{background:#e5e8db}}button:disabled{opacity:.45;cursor:wait}
  .upload{display:block;background:#546447;color:#fff;border:0;margin-top:26px}.upload input{position:absolute;opacity:0;width:1px;height:1px}
  .caption{font:11px/1.7 system-ui;color:#818575}.divider{height:1px;background:#d8d8cb;margin:25px 0}
  .scene-controls{display:flex;gap:8px}.scene-controls button{padding:8px 12px;font-size:11px}.scene-controls button[aria-pressed=true]{background:#e1e6d7;border-color:#849473}
  #status{min-height:40px;font-size:12px}footer{font:11px system-ui;color:#8a8d7e;margin-top:30px}
  @media(max-width:700px){body{padding:22px 20px}.layout{grid-template-columns:1fr;gap:26px;padding-top:24px}.stage{height:420px}h1{font-size:32px}.upload{margin-top:18px}footer{margin-top:20px}}
</style>
<main>
  <header><a href="./">Phubbing Anchor</a><span>PET ATELIER / 01</span></header>
  <div class="layout">
    <div class="stage" id="stage"><div class="speech" id="speech" role="status">正在準備狗狗…</div><div id="viewer"></div></div>
    <section>
      <div class="eyebrow">一起照顧的小夥伴</div><h1>讓牠，<br>更像在你身邊。</h1>
      <p>有毛流的身體、會跟著動的耳朵。<br>摸摸牠，或陪牠吃頓飯。</p>
      <div class="actions"><button data-action="feed" disabled>餵食</button><button data-action="wipe" disabled>清潔</button><button data-action="play" disabled>玩耍</button></div>
      <div class="scene-controls"><button data-scene="morning-sunroom" aria-pressed="true">晨光起居室</button><button data-scene="sunset-terrace" aria-pressed="false">黃昏露台</button></div>
      <div class="divider"></div>
      <p>人臉，還是原本的你。</p>
      <p class="caption">選一張正面照片，自動裁出臉部貼上身體。保留五官與照片比例，直接在這台裝置預覽。</p>
      <label class="upload">用自己的照片試試<input id="portrait" type="file" accept="image/*"></label>
      <p id="status" role="status">照片不會上傳。這裡的互動只供預覽，不會改動群組養成數值。</p>
    </section>
  </div>
  <footer>造型第二版 · 照片保真 / 骨架動畫<br><br>Autumn © Blender Foundation · <a href="https://studio.blender.org/characters/autumn/v1/" target="_blank" rel="noopener">Blender Studio</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · 已改作網頁模型、毛片與照顧動畫。</footer>
</main>
<script type="module" src="./features/pets/preview.js?v=2"></script>
</html>
