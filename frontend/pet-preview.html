<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f2e7">
<title>一起養 · 狗狗的小屋</title>
<link rel="stylesheet" href="./features/pets/illustrated-preview.css">
<script type="module" src="./features/pets/illustrated-preview.js"></script>
</head>
<body>
<main>
<header><a href="./index.html" class="brand">一起養 <span>／ 狗狗的小屋</span></a><span class="preview-note">互動試玩</span></header>
<section class="home" aria-label="狗狗的小屋">
<div class="welcome"><p class="eyebrow">A LITTLE COMPANY, EVERY DAY</p><h1>今天，也想和你一起。</h1><p>摸摸牠，或把餅乾拿給牠。</p></div>
<div class="stage" id="stage">
<div class="sunlight" aria-hidden="true"></div><div class="floor" aria-hidden="true"></div>
<p class="speech" id="speech" role="status">狗狗正在過來…</p>
<div class="viewer" id="viewer" aria-busy="true"></div>
<button class="pet-hit" id="pet-hit" aria-label="摸摸狗狗的頭" disabled></button>
<div class="loading" id="loading"><span id="load-status">準備互動畫面…</span><button id="retry" hidden>再試一次</button></div>
<div class="food-target" id="food-target" aria-hidden="true"><span>給我嗎？</span></div>
</div>
<div class="care-tray">
<div class="snack-slot"><button class="snack" id="snack" aria-label="拖餅乾到狗狗手邊，或點一下餵食" disabled><svg viewBox="0 0 60 52" aria-hidden="true"><defs><linearGradient id="cookie" x2=".7" y2="1"><stop stop-color="#edd1a1"/><stop offset="1" stop-color="#c58f53"/></linearGradient></defs><rect x="6" y="7" width="48" height="38" rx="13" fill="url(#cookie)" stroke="#bb8c56" stroke-width="1.5"/><path d="M15 16h30M15 36h30" stroke="#f1d3a5" stroke-width="2"/><g fill="#ae7d47"><circle cx="20" cy="25" r="2"/><circle cx="30" cy="25" r="2"/><circle cx="40" cy="25" r="2"/></g></svg></button><span>拖到牠的手邊</span></div>
<div class="action-buttons"><button id="feed" class="primary" disabled>餵一口</button><button id="pet" disabled>摸摸牠</button></div>
</div>
<div class="footnote"><span id="mood">等你陪牠一下</span><span id="fed-count">這次餵了 0 口</span></div>
</section>
<footer>試玩只在這個畫面互動，不寫入正式養成數值。</footer>
</main>
</body></html>
